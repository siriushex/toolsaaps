// Adds an external test driver to a pristine, pinned upstream checkout.
gradle.projectsEvaluated {
    def sdk = gradle.rootProject.findProject(':core:nssdk')
    if (sdk == null) return
    def source = System.getenv('AAPS_INTEROP_SOURCE')
    def output = System.getenv('AAPS_INTEROP_CLASSPATH')
    def querySource = System.getenv('AAPS_INTEROP_QUERY_SOURCE')
    if (!source || !output) throw new GradleException('Missing interop paths')
    sdk.kotlin.sourceSets.getByName('jvmTest').kotlin.srcDir(source)
    sdk.kotlin.sourceSets.getByName('jvmTest').kotlin.srcDir(new File(new File(source).parentFile, 'shared_src'))
    if (new File(source).name == 'final_src') {
        sdk.kotlin.sourceSets.getByName('jvmTest').dependencies {
            implementation(sdk.project(':database:impl'))
        }
    }
    if (querySource) {
        sdk.kotlin.sourceSets.getByName('jvmTest').kotlin.srcDir(querySource)
        if (new File(querySource).name == 'loopback_src') {
            sdk.kotlin.sourceSets.getByName('jvmTest').dependencies {
                implementation(sdk.libs.io.socket.client)
                implementation(sdk.libs.org.json.android)
            }
        }
    }
    sdk.tasks.register('exportInteropClasspath') {
        dependsOn sdk.tasks.named('jvmTestClasses')
        doLast {
            def target = new File(output)
            target.parentFile.mkdirs()
            target.text = sdk.tasks.getByName('jvmTest').classpath.asPath
        }
    }
}
