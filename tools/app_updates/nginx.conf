# Include only inside the existing HTTPS virtual host.
location = /app-updates/latest.json {
    root /var/www/copilot-downloads;
    try_files $uri =404;
    default_type application/json;
    disable_symlinks on;
    limit_except GET { deny all; }
}
location = /app-updates/ {
    root /var/www/copilot-downloads;
    try_files /app-updates/index.html =404;
    default_type text/html;
    disable_symlinks on;
    limit_except GET { deny all; }
}
location ~ "^/app-updates/[a-f0-9]{64}\.apk$" {
    root /var/www/copilot-downloads;
    try_files $uri =404;
    types { }
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    disable_symlinks on;
    limit_except GET { deny all; }
}
