name: Native Client Candidate

on:
  push:
    paths:
      - tools/session_store/**
      - .github/workflows/native-client.yml
  workflow_dispatch:
    inputs:
      retain_candidate:
        description: Retain verified candidate without session state for seven days
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: native-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-client:
    name: Pinned Linux build and synthetic protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build tooling tests
        run: python3 -m unittest discover -s tools/session_store -p 'test_*.py'
      - name: Fetch exact public source
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/native-source"
          git -C "$RUNNER_TEMP/native-source" -c credential.helper= fetch --depth=1 https://github.com/openai/codex.git 042fb41b7c813ac7999105e886b2b7aa715b5081
          git -C "$RUNNER_TEMP/native-source" checkout --detach 3d2ee51ca2d5db578f328aa75e20aa22c0197c9a
          git -C "$RUNNER_TEMP/native-source" fsck --no-reflogs --no-dangling
      - name: Verify and apply source-bound patch
        run: python3 tools/session_store/native_build.py prepare --source-root "$RUNNER_TEMP/native-source" --receipt "$RUNNER_TEMP/build-receipt.json"
      - name: Prepare native compiler and Linux dependencies
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev bubblewrap strace openssl iproute2
          rustc +1.95.0 --version --verbose
          df -h "$RUNNER_TEMP"
      - name: Synthetic TLS namespace preflight
        run: bash tools/session_store/protocol_smoke.sh /usr/bin/true --preflight
      - name: Offline namespace preflight
        run: |
          set -euo pipefail
          host_net="$(readlink /proc/self/ns/net)"
          timeout --signal=TERM --kill-after=3s 25s sudo -n setpriv --no-new-privs bwrap \
            --unshare-pid --unshare-net --unshare-ipc --unshare-uts \
            --die-with-parent --new-session --cap-drop ALL --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 --proc /proc --dev /dev --perms 1777 --tmpfs /tmp \
            --dir /work --ro-bind "$GITHUB_WORKSPACE/tools/session_store/offline_smoke.py" /work/check.py \
            --chdir /work --clearenv --setenv PATH /usr/bin:/bin \
            -- /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            /usr/bin/python3 /work/check.py "$host_net" --preflight
      - name: Normalize only upstream workspace version metadata
        working-directory: ${{ runner.temp }}/native-source/codex-rs
        run: cargo +1.95.0 update --workspace
      - name: Admit metadata-only lock delta
        run: python3 tools/session_store/native_build.py record-lock --source-root "$RUNNER_TEMP/native-source" --receipt "$RUNNER_TEMP/build-receipt.json"
      - name: Native login component tests
        working-directory: ${{ runner.temp }}/native-source/codex-rs
        run: cargo +1.95.0 test --locked --profile dev-small -p codex-login --lib -- --test-threads=2
      - name: Build actual client
        working-directory: ${{ runner.temp }}/native-source/codex-rs
        run: cargo +1.95.0 build --locked --profile dev-small -p codex-cli --bin codex
      - name: Verify source and binary provenance
        run: |
          set -euo pipefail
          python3 tools/session_store/native_build.py verify --source-root "$RUNNER_TEMP/native-source" --receipt "$RUNNER_TEMP/build-receipt.json"
          sha256sum "$RUNNER_TEMP/native-source/codex-rs/target/dev-small/codex"
          file "$RUNNER_TEMP/native-source/codex-rs/target/dev-small/codex"
      - name: Package bounded runtime candidate
        run: |
          set -euo pipefail
          cargo +1.95.0 metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu --manifest-path "$RUNNER_TEMP/native-source/codex-rs/Cargo.toml" > "$RUNNER_TEMP/runtime-metadata.json"
          python3 tools/session_store/runtime_bundle.py create \
            --source-root "$RUNNER_TEMP/native-source" --build-receipt "$RUNNER_TEMP/build-receipt.json" \
            --metadata "$RUNNER_TEMP/runtime-metadata.json" --cargo-home "${CARGO_HOME:-$HOME/.cargo}" \
            --output "$RUNNER_TEMP/runtime-candidate" --receipt "$RUNNER_TEMP/runtime-receipt.json" --project-commit "$GITHUB_SHA"
      - name: Offline minimal-root version smoke
        run: |
          set -euo pipefail
          host_net="$(readlink /proc/self/ns/net)"
          timeout --signal=TERM --kill-after=3s 25s sudo -n setpriv --no-new-privs bwrap \
            --unshare-pid --unshare-net --unshare-ipc --unshare-uts \
            --die-with-parent --new-session --cap-drop ALL --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 --proc /proc --dev /dev --perms 1777 --tmpfs /tmp \
            --dir /work --ro-bind "$RUNNER_TEMP/runtime-candidate/bin/client" /work/client \
            --ro-bind "$GITHUB_WORKSPACE/tools/session_store/offline_smoke.py" /work/check.py \
            --chdir /work --clearenv --setenv PATH /usr/bin:/bin \
            -- /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            /usr/bin/python3 /work/check.py "$host_net"
      - name: Synthetic TLS device-code and cancellation
        run: bash tools/session_store/protocol_smoke.sh "$RUNNER_TEMP/runtime-candidate/bin/client"
      - name: Synthetic OAuth exchange and session readback
        run: bash tools/session_store/protocol_smoke.sh "$RUNNER_TEMP/runtime-candidate/bin/client" --exchange
      - name: Reverify tested package and publish digest receipt
        run: |
          set -euo pipefail
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["manifest_sha256"])' "$RUNNER_TEMP/runtime-receipt.json")"
          python3 tools/session_store/runtime_bundle.py verify --root "$RUNNER_TEMP/runtime-candidate" --manifest-sha256 "$digest"
          printf 'Candidate manifest SHA256: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/runtime-receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain verified runtime candidate on explicit dispatch only
        if: github.event_name == 'workflow_dispatch' && inputs.retain_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: personal-ai-runtime-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-candidate/
          if-no-files-found: error
          retention-days: 7
